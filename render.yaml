services:
  - type: web
    name: recruitment-tracking
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start -H 0.0.0.0 -p $PORT
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: POWER_AUTOMATE_REJECTION_LETTER_WEBHOOK_URL
        sync: false
      - key: POWER_AUTOMATE_REJECTION_LETTER_WEBHOOK_SECRET
        sync: false
      - key: POWER_AUTOMATE_REJECTION_LETTER_SHARED_MAILBOX
        sync: false
      - key: POWER_AUTOMATE_TEAMS_MEETING_WEBHOOK_URL
        sync: false
      - key: POWER_AUTOMATE_TEAMS_MEETING_WEBHOOK_SECRET
        sync: false
      - key: POWER_AUTOMATE_TEAMS_MEETING_SHARED_MAILBOX
        sync: false
